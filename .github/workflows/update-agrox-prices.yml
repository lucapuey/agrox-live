name: Actualizar precios AGROX

on:
  # 08:17 en Argentina (UTC-3). GitHub puede retrasar algunos minutos las tareas programadas.
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
  # Cuando se edita la app o el actualizador, volver a probar y publicar.
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: agrox-update-and-publish
  cancel-in-progress: false

jobs:
  update-and-package:
    permissions:
      contents: write
      pages: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Actualizar precios e históricos
        env:
          CONSIGNATARIAS_API_KEY: ${{ secrets.CONSIGNATARIAS_API_KEY }}
        run: python scripts/update_prices.py

      - name: Validar datos y app
        run: |
          python -m json.tool data/prices.json > /dev/null
          python -m unittest discover -s tests -v
          node tests/runtime_smoke.cjs

      - name: Guardar cambios del histórico en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "Sin cambios de datos nuevos; se conserva el último dato válido."
          else
            git commit -m "chore(data): daily AGROX price refresh"
            git push
          fi

      - name: Preparar archivos estáticos para publicar
        run: |
          rm -rf _site
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/prices.json _site/data/prices.json
          cp data/soja_monthly_history.json _site/data/soja_monthly_history.json
          cp .nojekyll _site/.nojekyll

      - name: Cargar paquete del sitio para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update-and-package
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publicar sitio AGROX
        id: deployment
        uses: actions/deploy-pages@v4
